{% load static %}

<!DOCTYPE html>
<html lang="cs">

    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>
            Certifikát – {{ participant.first_name }} {{ participant.last_name }}
        </title>

        <link rel="stylesheet" href="{% static 'courses/css/certificate.css' %}">

        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: #ffffff;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }

            .certificate-print-wrapper {
                width: 210mm;
                min-height: 297mm;
                margin: 0 auto;
                background: #ffffff;
            }

            @page {
                size: A4;
                margin: 0;
            }

            @media print {

                html,
                body {
                    width: 210mm;
                    height: 297mm;
                    background: #ffffff;
                }

                .certificate-print-wrapper {
                    margin: 0;
                    width: 210mm;
                    min-height: 297mm;
                }
            }
        </style>
    </head>

    <body>

        <div class="certificate-print-wrapper">
            {% include "courses/certificate_document.html" %}
        </div>

    </body>

</html>
