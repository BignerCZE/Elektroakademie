<!DOCTYPE html>
<html lang="cs">

    <head>
        <meta charset="UTF-8">

        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 210mm;
                background: #ffffff;
            }

            body {
                overflow: visible;
            }

            body.certificate-pdf .certificate-document {
                display: grid;

                line-height: 1.35;

            @page {
                size: A4;
                margin: 0;
            }
