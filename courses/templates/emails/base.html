<!DOCTYPE html>
<html lang="cs">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light">
        <meta name="supported-color-schemes" content="light">

        <title>
            {% block title %}Elektroakademie{% endblock %}
        </title>

        <style>
            body,
            table,
            td,
            a {
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
            }

            table,
            td {
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }

            table {
                border-collapse: collapse !important;
            }

            img {
                -ms-interpolation-mode: bicubic;
                border: 0;
                height: auto;
                line-height: 100%;
                outline: none;
                text-decoration: none;
            }

            body {
                width: 100% !important;
                min-width: 100%;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: #f3f6f9;
            }

            a {
                color: #1667a8;
            }

            @media only screen and (max-width: 620px) {
                .email-shell {
                    padding: 0 !important;
                }

                .email-card {
                    width: 100% !important;
                    max-width: 100% !important;
                    border-radius: 0 !important;
                }

                .email-header {
                    padding: 26px 22px !important;
                }

                .email-content {
                    padding: 30px 22px !important;
                }

                .email-footer {
                    padding: 22px !important;
                }

                .email-heading {
                    font-size: 23px !important;
                    line-height: 30px !important;
                }

                .email-button-cell {
                    width: 100% !important;
                }

                .email-button {
                    display: block !important;
                    width: auto !important;
                    text-align: center !important;
                }

                .info-label,
                .info-value {
                    display: block !important;
                    width: 100% !important;
                    text-align: left !important;
                }

                .info-label {
                    padding-bottom: 2px !important;
                }

                .info-value {
                    padding-bottom: 12px !important;
                }
            }
        </style>
    </head>

    <body style="
        margin: 0;
        padding: 0;
        background-color: #f3f6f9;
        font-family: Arial, Helvetica, sans-serif;
        color: #24313d;
    ">

        <div style="
        display: none;
        max-height: 0;
        max-width: 0;
        overflow: hidden;
        opacity: 0;
        color: transparent;
        mso-hide: all;
    ">
            {% block preheader %}{% endblock %}
        </div>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="
        width: 100%;
        background-color: #f3f6f9;
    ">
            <tr>
                <td align="center" class="email-shell" style="
                padding: 36px 16px;
            ">

                    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="email-card"
                        style="
                    width: 100%;
                    max-width: 600px;
                    background-color: #ffffff;
                    border: 1px solid #dfe6ec;
                    border-radius: 12px;
                    overflow: hidden;
                ">

                        <tr>
                            <td class="email-header" style="
                            padding: 30px 40px;
                            background-color: #154f7d;
                            border-bottom: 4px solid #2385c7;
                        ">
                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                    <tr>
                                        <td align="left">
                                            <div style="
                                            margin: 0;
                                            font-size: 23px;
                                            line-height: 28px;
                                            font-weight: 700;
                                            letter-spacing: 0.5px;
                                            color: #ffffff;
                                        ">
                                                Elektroakademie
                                            </div>

                                            <div style="
                                            margin-top: 5px;
                                            font-size: 12px;
                                            line-height: 18px;
                                            color: #dcecf7;
                                        ">
                                                Odborné vzdělávání v elektrotechnice
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr>
                            <td class="email-content" style="
                            padding: 40px;
                        ">
                                {% block content %}{% endblock %}
                            </td>
                        </tr>

                        <tr>
                            <td class="email-footer" style="
                            padding: 24px 40px;
                            background-color: #f7f9fb;
                            border-top: 1px solid #e3e8ed;
                            text-align: center;
                        ">
                                <p style="
                                margin: 0 0 4px;
                                font-size: 13px;
                                line-height: 20px;
                                font-weight: 700;
                                color: #4a5966;
                            ">
                                    Elektroakademie
                                </p>

                                <p style="
                                margin: 0;
                                font-size: 12px;
                                line-height: 19px;
                                color: #7a8792;
                            ">
                                    Tento e-mail byl vytvořen automaticky.
                                </p>

                                {% block footer %}{% endblock %}
                            </td>
                        </tr>

                    </table>

                </td>
            </tr>
        </table>

    </body>

</html>
